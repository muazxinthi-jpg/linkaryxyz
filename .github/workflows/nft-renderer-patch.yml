name: Apply NFT renderer patch

on:
  push:
    branches:
      - fix/nft-artwork-resolution

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nft-artwork-resolution
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch renderer and tests
        run: node scripts/patch-nft-profile-renderer.mjs
      - name: Validate patch
        run: git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/profiles.ts tests/profile-editor-social-nft.test.ts
          git commit -m "fix: wire exact NFT artwork resolver into public profiles"
          git push origin HEAD:fix/nft-artwork-resolution
