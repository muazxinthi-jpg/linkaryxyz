name: Profile section live check

on:
  push:
    branches:
      - diagnostic/profile-section-live-check

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live profile section labels
        shell: bash
        run: |
          python3 - <<'PY'
          import time, urllib.request
          url = 'https://linkary.xyz/muazxinthi?sectioncheck=' + str(int(time.time()))
          req = urllib.request.Request(url, headers={'User-Agent':'Linkary-Live-Check/1.0','Cache-Control':'no-cache'})
          html = urllib.request.urlopen(req, timeout=20).read().decode('utf-8','replace')
          print('NFT_COLLECTION_COUNT=', html.count('NFT COLLECTION'))
          print('COLLECTED_IDENTITY_COUNT=', html.count('COLLECTED IDENTITY'))
          print('LINKS_WORK_COUNT=', html.count('Links & work'))
          if 'NFT COLLECTION' not in html:
              raise SystemExit('NFT COLLECTION heading missing from live profile')
          if 'COLLECTED IDENTITY' in html:
              raise SystemExit('Old COLLECTED IDENTITY heading still present')
          if 'Links & work' in html:
              raise SystemExit('Unwanted Links & work section still present')
          PY

      - name: Diagnose app host profile route
        shell: bash
        run: |
          set +e
          echo '=== HEADERS ==='
          curl -sS -D /tmp/headers.txt -o /tmp/body.txt -w 'HTTP_STATUS=%{http_code}\nREMOTE_IP=%{remote_ip}\n' 'https://app.linkary.xyz/profile?diagnostic=1'
          cat /tmp/headers.txt
          echo '=== BODY START ==='
          head -c 2000 /tmp/body.txt || true
          echo
          echo '=== ROOT CHECK ==='
          curl -sS -D /tmp/root-headers.txt -o /tmp/root-body.txt -w 'ROOT_STATUS=%{http_code}\n' 'https://app.linkary.xyz/?diagnostic=1'
          cat /tmp/root-headers.txt
          head -c 1000 /tmp/root-body.txt || true
          echo
