name: Profile section live check

on:
  push:
    branches:
      - diagnostic/profile-section-live-check

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live app routes and assets
        shell: bash
        run: |
          check() {
            url="$1"
            echo "=== $url ==="
            curl -sS -o /tmp/body -D /tmp/headers -w 'STATUS=%{http_code} SIZE=%{size_download} TYPE=%{content_type}\n' "$url"
            grep -Ei '^(HTTP/|content-type:|content-length:|location:|x-robots-tag:|cf-ray:|server:)' /tmp/headers || true
            head -c 220 /tmp/body || true
            echo
          }
          check 'https://app.linkary.xyz/profile?diagnostic=2'
          check 'https://app.linkary.xyz/?diagnostic=2'
          check 'https://app.linkary.xyz/app/index.html?diagnostic=2'
          check 'https://app.linkary.xyz/app/assets/index-D9Zpcjle.js?diagnostic=2'
          check 'https://app.linkary.xyz/app/assets/index-ClxE31P1.css?diagnostic=2'
          check 'https://app.linkary.xyz/assets/social/x.svg?diagnostic=2'
