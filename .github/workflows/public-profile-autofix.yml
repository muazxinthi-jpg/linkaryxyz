name: Apply public profile regression fix

on:
  push:
    branches:
      - fix/public-profile-analytics-previews-layout
    paths:
      - .github/workflows/public-profile-autofix.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/public-profile-analytics-previews-layout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Apply shared profile fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one target, found {count}')
              p.write_text(text.replace(old, new, 1))

          profiles = 'src/routes/profiles.ts'
          old_analytics = r'''export async function profileAnalytics(request: Request, env: Env, profileId: string): Promise<Response> {
            const auth = await requireAuth(request, env);
            const db = new Db(requireDb(env));
            await requireEditableProfile(db, auth.user.id, profileId);
            const row = await db.first<{ link_clicks: number }>('SELECT COUNT(*) AS link_clicks FROM profile_engagement_events WHERE profile_id = ?', [profileId]);
            return json({ linkClicks: row?.link_clicks || 0 });
          }'''
          new_analytics = r'''type ProfileClickMonthRow = { month: string; count: number };
          type ProfileClickDestinationRow = { block_id: string; count: number };

          function monthlyClickSeries(rows: ProfileClickMonthRow[], totalClicks: number): ProfileClickMonthRow[] {
            if (!totalClicks || !rows.length) return [];
            const byMonth = new Map(rows.map((row) => [row.month, Number(row.count || 0)]));
            const latest = rows[rows.length - 1]?.month;
            const current = new Date();
            const latestDate = latest ? new Date(`${latest}-01T00:00:00Z`) : current;
            const elevenMonthsAgo = new Date(Date.UTC(current.getUTCFullYear(), current.getUTCMonth() - 11, 1));
            const anchor = !Number.isNaN(latestDate.getTime()) && latestDate < elevenMonthsAgo ? latestDate : current;
            return Array.from({ length: 12 }, (_, index) => {
              const date = new Date(Date.UTC(anchor.getUTCFullYear(), anchor.getUTCMonth() - (11 - index), 1));
              const month = `${date.getUTCFullYear()}-${String(date.getUTCMonth() + 1).padStart(2, '0')}`;
              return { month, count: byMonth.get(month) || 0 };
            });
          }

          function clickDestinationLabel(block: ProfileBlockRow): string {
            const social = socialName(block);
            const socialLabels: Record<string, string> = {
              x: 'X', linkedin: 'LinkedIn', youtube: 'YouTube', instagram: 'Instagram', tiktok: 'TikTok',
              facebook: 'Facebook', telegram: 'Telegram', whatsapp: 'WhatsApp', reddit: 'Reddit', discord: 'Discord',
              github: 'GitHub', farcaster: 'Farcaster',
            };
            if (social) return socialLabels[social] || social;
            if (block.url) {
              try {
                const host = new URL(block.url).hostname.replace(/^www\./, '');
                if (host) return host;
              } catch {
                // Stored destinations are validated on write. Keep analytics rendering resilient to legacy rows.
              }
            }
            return block.title?.trim() || 'Other';
          }

          export async function profileAnalytics(request: Request, env: Env, profileId: string): Promise<Response> {
            const auth = await requireAuth(request, env);
            const db = new Db(requireDb(env));
            const profile = await requireEditableProfile(db, auth.user.id, profileId);
            const [totalRow, monthRows, destinationRows, blocks, proof] = await Promise.all([
              db.first<{ link_clicks: number }>(
                "SELECT COUNT(*) AS link_clicks FROM profile_engagement_events WHERE profile_id = ? AND event_type = 'link_click'",
                [profileId],
              ),
              db.all<ProfileClickMonthRow>(
                `SELECT substr(created_at, 1, 7) AS month, COUNT(*) AS count
                   FROM profile_engagement_events
                  WHERE profile_id = ? AND event_type = 'link_click'
                  GROUP BY substr(created_at, 1, 7)
                  ORDER BY month ASC`,
                [profileId],
              ),
              db.all<ProfileClickDestinationRow>(
                `SELECT block_id, COUNT(*) AS count
                   FROM profile_engagement_events
                  WHERE profile_id = ? AND event_type = 'link_click' AND block_id IS NOT NULL
                  GROUP BY block_id
                  ORDER BY count DESC`,
                [profileId],
              ),
              db.all<ProfileBlockRow>('SELECT * FROM profile_blocks WHERE profile_id = ?', [profileId]),
              loadPublicProof(db, profile),
            ]);
            const linkClicks = Number(totalRow?.link_clicks || 0);
            const blockById = new Map(blocks.map((block) => [block.id, block]));
            const destinationTotals = new Map<string, number>();
            for (const row of destinationRows) {
              const block = blockById.get(row.block_id);
              if (!block) continue;
              const label = clickDestinationLabel(block);
              destinationTotals.set(label, (destinationTotals.get(label) || 0) + Number(row.count || 0));
            }
            const platformClicks = Array.from(destinationTotals, ([platform, count]) => ({ platform, count }))
              .sort((left, right) => right.count - left.count || left.platform.localeCompare(right.platform));
            return json({
              linkClicks,
              monthlyClicks: monthlyClickSeries(monthRows, linkClicks),
              platformClicks,
              proof,
            });
          }'''
          replace_once(profiles, old_analytics, new_analytics)

          old_feature = r'''  const socialHtml = socials.map((block) => `<a class=\"social\" href=\"${escapeHtml(blockUrl(block))}\" aria-label=\"${escapeHtml(block.title || 'Social link')}\">${publicIcon(block)}</a>`).join('');
            const featureCards = (await Promise.all(features.map(async (block, index) => {
              const config = safeJson(block.config_json) as { mediaUrl?: string };
              const resolved = await resolveFeaturedPreview(config.mediaUrl, block.url, block.block_type);
              const fallback = '<span class=\"feature-art\">◆</span>';
              const media = resolved?.kind === 'video'
                ? `<video src=\"${escapeHtml(resolved.src)}\" muted playsinline loop autoplay preload=\"metadata\" onerror=\"this.hidden=true;var f=this.nextElementSibling;if(f)f.hidden=false\"></video><span class=\"feature-art\" hidden>◆</span>`
                : resolved?.kind === 'image'
                  ? `<img src=\"${escapeHtml(resolved.src)}\" alt=\"\" loading=\"lazy\" referrerpolicy=\"no-referrer\" onerror=\"this.hidden=true;var f=this.nextElementSibling;if(f)f.hidden=false\"><span class=\"feature-art\" hidden>◆</span>${resolved.youtube ? '<span class=\"feature-play\">▶</span>' : ''}`
                  : fallback;
              return `<a class=\"feature ${index === 0 ? 'hero-feature' : ''}\" href=\"${escapeHtml(blockUrl(block))}\">${media}<span class=\"feature-shade\"></span><span class=\"feature-copy\"><small>${escapeHtml(block.block_type.replace('featured_', 'FEATURED ').toUpperCase())}</small><strong>${escapeHtml(block.title || 'Open featured work')}</strong><i>Explore ↗</i></span></a>`;
            }))).join('');'''
          new_feature = r'''  const socialHtml = socials.map((block) => `<a class=\"social\" href=\"${escapeHtml(blockUrl(block))}\" aria-label=\"${escapeHtml(block.title || 'Social link')}\">${publicIcon(block)}</a>`).join('');
            const previewFallback = (block: ProfileBlockRow, compact = false, hidden = false): string => {
              let host = 'External link';
              try { host = new URL(block.url || '').hostname.replace(/^www\./, '') || host; } catch { /* Legacy destinations still get a deterministic preview. */ }
              const initial = (host === 'External link' ? block.title || 'L' : host).trim().slice(0, 1).toUpperCase() || 'L';
              const label = block.block_type === 'featured_article' ? 'ARTICLE PREVIEW' : block.block_type === 'featured_video' ? 'VIDEO PREVIEW' : 'LINK PREVIEW';
              return `<span class=\"${compact ? 'showcase-site-preview' : 'feature-site-preview'}\"${hidden ? ' hidden' : ''}><b>${escapeHtml(initial)}</b><span><small>${escapeHtml(label)}</small><strong>${escapeHtml(host)}</strong></span></span>`;
            };
            const featureCards = (await Promise.all(features.map(async (block, index) => {
              const config = safeJson(block.config_json) as { mediaUrl?: string };
              const resolved = await resolveFeaturedPreview(config.mediaUrl, block.url, block.block_type);
              const fallback = previewFallback(block);
              const media = resolved?.kind === 'video'
                ? `<video src=\"${escapeHtml(resolved.src)}\" muted playsinline loop autoplay preload=\"metadata\" onerror=\"this.hidden=true;var f=this.nextElementSibling;if(f)f.hidden=false\"></video>${previewFallback(block, false, true)}`
                : resolved?.kind === 'image'
                  ? `<img src=\"${escapeHtml(resolved.src)}\" alt=\"\" loading=\"lazy\" referrerpolicy=\"no-referrer\" onerror=\"this.hidden=true;var f=this.nextElementSibling;if(f)f.hidden=false\">${previewFallback(block, false, true)}${resolved.youtube ? '<span class=\"feature-play\">▶</span>' : ''}`
                  : fallback;
              return `<a class=\"feature ${index === 0 ? 'hero-feature' : ''}\" href=\"${escapeHtml(blockUrl(block))}\">${media}<span class=\"feature-shade\"></span><span class=\"feature-copy\"><small>${escapeHtml(block.block_type.replace('featured_', 'FEATURED ').toUpperCase())}</small><strong>${escapeHtml(block.title || 'Open featured work')}</strong><i>Explore ↗</i></span></a>`;
            }))).join('');'''
          replace_once(profiles, old_feature, new_feature)

          old_gallery_image = r'''      const image = media?.kind === 'image' ? `<img src=\"${escapeHtml(media.src)}\" alt=\"\" loading=\"lazy\" referrerpolicy=\"no-referrer\">` : '<b class=\"showcase-art\">◇</b>';
                return `<a class=\"showcase-item\" href=\"${escapeHtml(blockUrl(block))}\">${image}<span><strong>${escapeHtml(block.title || 'Featured item')}</strong>${config.chain ? `<small>${escapeHtml(config.chain)}</small>` : ''}</span></a>`;
              }));
              return `<section class=\"showcase ${className}\"><div class=\"showcase-title\"><span>${label}</span><span>${items.length}</span></div><div class=\"showcase-grid\">${cards.join('')}</div></section>`;'''
          new_gallery_image = r'''      const image = media?.kind === 'image'
                  ? `<img src=\"${escapeHtml(media.src)}\" alt=\"\" loading=\"lazy\" referrerpolicy=\"no-referrer\" onerror=\"this.hidden=true;var f=this.nextElementSibling;if(f)f.hidden=false\">${previewFallback(block, true, true)}`
                  : previewFallback(block, true);
                return `<a class=\"showcase-item\" href=\"${escapeHtml(blockUrl(block))}\">${image}<span><strong>${escapeHtml(block.title || 'Featured item')}</strong>${config.chain ? `<small>${escapeHtml(config.chain)}</small>` : ''}</span></a>`;
              }));
              const featuredWorkColumns = className === 'image-showcase' && items.length === 1
                ? ' style=\"grid-template-columns:1fr!important\"'
                : className === 'image-showcase' && items.length === 2
                  ? ' style=\"grid-template-columns:repeat(2,minmax(0,1fr))!important\"'
                  : '';
              return `<section class=\"showcase ${className} count-${items.length}\"><div class=\"showcase-title\"><span>${label}</span><span>${items.length}</span></div><div class=\"showcase-grid\"${featuredWorkColumns}>${cards.join('')}</div></section>`;'''
          replace_once(profiles, old_gallery_image, new_gallery_image)

          old_feature_html = r'''  const featureHtml = featureCards + (productHtml || featuredImages.length || nftItems.length ? `${galleryStyle}${galleryRefinement}${productHtml}${imageHtml}${nftHtml}` : '');'''
          new_feature_html = r'''  const previewFallbackStyle = `<style>.feature-site-preview,.showcase-site-preview{position:absolute;display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#fff7f2,#f6eee9);color:#17110e}.feature-site-preview{inset:14px 14px 110px;padding:24px;border-radius:19px}.showcase-site-preview{inset:10px 10px 58px;padding:15px;border-radius:15px}.feature-site-preview>b,.showcase-site-preview>b{flex:0 0 auto;display:grid;place-items:center;width:58px;height:58px;border-radius:18px;background:#ff6543;color:#fff;font-size:25px;box-shadow:0 9px 24px #ff65432e}.showcase-site-preview>b{width:44px;height:44px;border-radius:14px;font-size:19px}.feature-site-preview>span,.showcase-site-preview>span{display:grid;gap:5px;min-width:0}.feature-site-preview small,.showcase-site-preview small{color:#d84c2b;font:800 9px/1 ui-monospace,SFMono-Regular,monospace;letter-spacing:.12em}.feature-site-preview strong,.showcase-site-preview strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#17110e;font-size:17px}.showcase-site-preview strong{font-size:13px}.image-showcase.count-1 .showcase-item{min-height:360px!important}.image-showcase.count-2 .showcase-item{min-height:270px!important}@media(max-width:650px){.feature-site-preview{inset:10px 10px 92px;padding:16px}.image-showcase.count-1 .showcase-item{min-height:250px!important}.image-showcase.count-2 .showcase-item{min-height:190px!important}}</style>`;
            const hasProfileMedia = Boolean(featureCards || productHtml || featuredImages.length || nftItems.length);
            const featureHtml = hasProfileMedia ? `${previewFallbackStyle}${featureCards}${productHtml || featuredImages.length || nftItems.length ? `${galleryStyle}${galleryRefinement}${productHtml}${imageHtml}${nftHtml}` : ''}` : '';'''
          replace_once(profiles, old_feature_html, new_feature_html)

          editor = 'frontend/src/ProfileExperienceBeta.tsx'
          old_type = r'''type ProfileCardAnalytics = {
            linkClicks: number;
            sections: number;
            connectedChannels: number;
            x: { handle: string | null; followers: number | null; source: 'provider' | 'awaiting_provider' };
            monthlyClicks: Array<{ month: string; count: number }>;
          };'''
          new_type = r'''type ProfileCardAnalytics = {
            linkClicks: number;
            sections: number;
            connectedChannels: number;
            x: { handle: string | null; followers: number | null; source: 'provider' | 'awaiting_provider' };
            monthlyClicks: Array<{ month: string; count: number }>;
            platformClicks?: Array<{ platform: string; count: number }>;
            proof?: { metrics: Array<{ label: string; value: string }> } | null;
          };'''
          replace_once(editor, old_type, new_type)

          old_set = r'''        monthlyClicks: analyticsResult.monthlyClicks ?? [],
                });'''
          new_set = r'''        monthlyClicks: analyticsResult.monthlyClicks ?? [],
                  platformClicks: analyticsResult.platformClicks ?? [],
                  proof: analyticsResult.proof ?? null,
                });'''
          replace_once(editor, old_set, new_set)

          test_path = Path('tests/public-profile-analytics-layout-regression.test.ts')
          test_path.write_text(r'''import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';

          const profiles = readFileSync('src/routes/profiles.ts', 'utf8');
          const editor = readFileSync('frontend/src/ProfileExperienceBeta.tsx', 'utf8');
          const card = readFileSync('frontend/src/ProfileSocialCard.tsx', 'utf8');

          test('profile analytics restores measured monthly history and destination contribution', () => {
            assert.match(profiles, /GROUP BY substr\(created_at, 1, 7\)/);
            assert.match(profiles, /GROUP BY block_id/);
            assert.match(profiles, /monthlyClicks: monthlyClickSeries\(monthRows, linkClicks\)/);
            assert.match(profiles, /platformClicks,/);
            assert.match(profiles, /event_type = 'link_click'/);
            assert.match(editor, /platformClicks: analyticsResult\.platformClicks \?\? \[\]/);
            assert.match(editor, /proof: analyticsResult\.proof \?\? null/);
            assert.match(card, /onPointerEnter=\{\(\) => setPoint\(i\)\}/);
            assert.match(card, /Hover or touch to explore/);
          });

          test('featured work layout is count-aware without changing NFT or product grids', () => {
            assert.match(profiles, /className === 'image-showcase' && items\.length === 1/);
            assert.match(profiles, /grid-template-columns:1fr!important/);
            assert.match(profiles, /className === 'image-showcase' && items\.length === 2/);
            assert.match(profiles, /repeat\(2,minmax\(0,1fr\)\)!important/);
            assert.match(profiles, /showcase \$\{className\} count-\$\{items\.length\}/);
            assert.match(profiles, /image-showcase\.count-1 \.showcase-item/);
          });

          test('public media uses the shared preview resolver and deterministic nonblank fallback', () => {
            assert.match(profiles, /await resolveFeaturedPreview\(config\.mediaUrl, block\.url, block\.block_type\)/);
            assert.match(profiles, /const previewFallback = \(block: ProfileBlockRow/);
            assert.match(profiles, /ARTICLE PREVIEW/);
            assert.match(profiles, /showcase-site-preview/);
            assert.match(profiles, /onerror=\\"this\.hidden=true;var f=this\.nextElementSibling;if\(f\)f\.hidden=false/);
            assert.doesNotMatch(profiles, /const fallback = '<span class=\\"feature-art\\">◆<\/span>';/);
          });
          ''')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run full repository checks
        run: npm run check
      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "Linkary Engineering"
          git config user.email "engineering@linkary.xyz"
          git add src/routes/profiles.ts frontend/src/ProfileExperienceBeta.tsx tests/public-profile-analytics-layout-regression.test.ts
          git diff --cached --check
          git commit -m "Fix public profile analytics previews and layout"
          git push origin HEAD:fix/public-profile-analytics-previews-layout
