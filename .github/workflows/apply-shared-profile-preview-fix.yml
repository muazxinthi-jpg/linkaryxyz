name: Apply shared public profile preview fix

on:
  push:
    branches:
      - fix/shared-public-profile-preview-resolution

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/shared-public-profile-preview-resolution
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Apply guarded resolver repair
        run: python3 scripts/apply-shared-profile-preview-fix.py
      - name: Install dependencies
        run: npm ci
      - name: Run focused preview tests
        run: npx tsx --test tests/profile-media.test.ts tests/public-profile-preview-resolution.test.ts tests/public-profile-rendering-hotfix.test.ts
      - name: Run full repository checks
        run: npm run check
      - name: Commit verified resolver repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git config user.name "Muaz Linkary"
          git config user.email "muazxinthi@gmail.com"
          git add src/profileMedia.ts tests/profile-media.test.ts tests/public-profile-preview-resolution.test.ts
          git commit -m "fix: resolve previews across public profiles"
          git push origin HEAD:fix/shared-public-profile-preview-resolution
