name: Inspect public overlay versions

on:
  push:
    branches:
      - ops/inspect-public-overlay-versions

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: List public overlay versions
        run: npx wrangler versions list --config wrangler.public.jsonc --json
      - name: List public overlay deployments
        run: npx wrangler deployments list --config wrangler.public.jsonc --json
