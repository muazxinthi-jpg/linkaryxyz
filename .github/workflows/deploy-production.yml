name: Linkary production

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: linkary-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run regression tests
        run: npm test

      - name: Type-check authenticated app
        run: npm run app:check

      - name: Wrangler dry run
        run: npm run deploy:dry

      - name: Probe exact live NFT fallbacks
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html, re, subprocess, urllib.request
          items = [
            ('JIRASAN', 'https://opensea.io/item/ethereum/0x7fb2d396a3cc840f2c4213f044566ed400159b40/9967'),
            ('KABU', 'https://opensea.io/item/abstract/0x7e3059b08e981a369f99db26487ab4cbffdfef29/3057'),
            ('SNOOZIE', 'https://opensea.io/item/base/0x61a85534f124781231bab486b111534d9653f19a/2038'),
          ]
          for name, url in items:
            req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0','Accept':'text/html'})
            try:
              body = urllib.request.urlopen(req, timeout=15).read(500000).decode('utf-8','replace')
            except Exception as e:
              print(f'{name}_PAGE_ERROR={type(e).__name__}:{e}')
              continue
            matches = re.findall(r'<meta[^>]+(?:property|name)=["\'](?:og:image|twitter:image)["\'][^>]+content=["\']([^"\']+)', body, re.I)
            if not matches:
              matches = re.findall(r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+(?:property|name)=["\'](?:og:image|twitter:image)["\']', body, re.I)
            image = html.unescape(matches[0]) if matches else ''
            print(f'{name}_OG_IMAGE={image or "NONE"}')
            if image:
              proc = subprocess.run(['curl','-sS','-L','-I','-o','/dev/null','-w','%{http_code}|%{content_type}|%{url_effective}',image],capture_output=True,text=True)
              print(f'{name}_OG_HEAD={proc.stdout.strip() or "curl_failed"}')
          PY

          node --input-type=module <<'JS'
          const calls = [
            ['JIRASAN','https://ethereum-rpc.publicnode.com','0x7fb2d396a3cc840f2c4213f044566ed400159b40','9967'],
            ['KABU','https://api.mainnet.abs.xyz','0x7e3059b08e981a369f99db26487ab4cbffdfef29','3057'],
            ['SNOOZIE','https://mainnet.base.org','0x61a85534f124781231bab486b111534d9653f19a','2038'],
          ];
          for (const [name,rpc,to,token] of calls) {
            for (const selector of ['0xc87b56dd','0x0e89341c']) {
              const data = selector + BigInt(token).toString(16).padStart(64,'0');
              try {
                const res = await fetch(rpc,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'eth_call',params:[{to,data},'latest']})});
                const text = await res.text();
                console.log(`${name}_${selector}_STATUS=${res.status}`);
                console.log(`${name}_${selector}_RESULT=${text.slice(0,1200)}`);
              } catch (e) { console.log(`${name}_${selector}_ERROR=${e}`); }
            }
          }
          JS

      - name: Check Cloudflare deployment credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: cloudflare
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare repository secrets are not configured. Verification passed, deployment will be skipped."
          fi

      - name: Deploy Worker to production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cloudflare.outputs.ready == 'true'
        run: npm run deploy

      - name: Verify production app health
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cloudflare.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for path in / /profile; do
            ok=false
            for attempt in {1..12}; do
              body="/tmp/linkary-health-${attempt}.html"
              status=$(curl -sS -o "$body" -w '%{http_code}' "https://app.linkary.xyz${path}?deploycheck=${GITHUB_SHA}-${attempt}") || status=000
              if [[ "$status" == "200" ]] && grep -q 'id="root"' "$body"; then
                echo "Healthy: https://app.linkary.xyz${path}"
                ok=true
                break
              fi
              echo "Waiting for app route ${path}, attempt ${attempt}, status ${status}"
              sleep 5
            done
            if [[ "$ok" != "true" ]]; then
              echo "Production app health check failed for https://app.linkary.xyz${path}"
              exit 1
            fi
          done

      - name: Deployment skipped
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cloudflare.outputs.ready != 'true'
        run: echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable automatic production deployment."

      - name: Pull request verification complete
        if: github.event_name == 'pull_request'
        run: echo "Verification passed. Pull requests never deploy to production."
