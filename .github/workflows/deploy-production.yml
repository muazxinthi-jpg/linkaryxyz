name: Linkary production

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: linkary-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run regression tests
        run: npm test

      - name: Type-check authenticated app
        run: npm run app:check

      - name: Wrangler dry run
        run: npm run deploy:dry

      - name: Verify deployed NFT cards live
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          profile=/tmp/live-profile.html
          status=$(curl -sS -L -o "$profile" -w '%{http_code}' "https://linkary.xyz/muazxinthi?livecheck=1969a4b63ed21cc75b9316d6362fced4e151f38b")
          echo "PROFILE_STATUS=$status"
          [[ "$status" == "200" ]]
          python - <<'PY'
          import html, re, subprocess, sys
          from pathlib import Path
          source = Path('/tmp/live-profile.html').read_text(errors='replace')
          section = re.search(r'<section class="showcase nft-showcase">[\s\S]*?</section>', source)
          if not section:
              print('NFT_SECTION_NOT_FOUND')
              sys.exit(1)
          cards = re.findall(r'<a class="showcase-item"[^>]*>([\s\S]*?)</a>', section.group(0))
          print(f'NFT_CARD_COUNT={len(cards)}')
          expected = {'AZUKI Elemental','JIRASAN','KABU','SNOOZIE'}
          seen = set()
          failures = []
          for index, card in enumerate(cards, 1):
              tm = re.search(r'<strong>([\s\S]*?)</strong>', card)
              title = html.unescape(re.sub(r'<[^>]+>', '', tm.group(1))).strip() if tm else '(untitled)'
              seen.add(title)
              im = re.search(r'<img src="([^"]+)"', card)
              image = html.unescape(im.group(1)) if im else ''
              print(f'NFT_{index}_TITLE={title}')
              print(f'NFT_{index}_IMAGE={image or "NONE"}')
              if title in expected and not image:
                  failures.append(f'{title}: no image')
                  continue
              if title in expected:
                  proc = subprocess.run(['curl','-sS','-L','-I','-o','/dev/null','-w','%{http_code}|%{content_type}|%{url_effective}',image],capture_output=True,text=True)
                  result = proc.stdout.strip()
                  print(f'NFT_{index}_HEAD={result or "curl_failed"}')
                  parts = result.split('|',2)
                  if len(parts) < 2 or parts[0] != '200' or not parts[1].startswith('image/'):
                      failures.append(f'{title}: unusable image response {result}')
          missing = expected - seen
          if missing:
              failures.append('missing cards: ' + ', '.join(sorted(missing)))
          if failures:
              print('LIVE_NFT_FAILURES=' + '; '.join(failures))
              sys.exit(1)
          print('LIVE_NFT_VERIFIED=AZUKI Elemental,JIRASAN,KABU,SNOOZIE')
          PY

      - name: Check Cloudflare deployment credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: cloudflare
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare repository secrets are not configured. Verification passed, deployment will be skipped."
          fi

      - name: Deploy Worker to production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cloudflare.outputs.ready == 'true'
        run: npm run deploy

      - name: Verify production app health
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cloudflare.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for path in / /profile; do
            ok=false
            for attempt in {1..12}; do
              body="/tmp/linkary-health-${attempt}.html"
              status=$(curl -sS -o "$body" -w '%{http_code}' "https://app.linkary.xyz${path}?deploycheck=${GITHUB_SHA}-${attempt}") || status=000
              if [[ "$status" == "200" ]] && grep -q 'id="root"' "$body"; then
                echo "Healthy: https://app.linkary.xyz${path}"
                ok=true
                break
              fi
              echo "Waiting for app route ${path}, attempt ${attempt}, status ${status}"
              sleep 5
            done
            if [[ "$ok" != "true" ]]; then
              echo "Production app health check failed for https://app.linkary.xyz${path}"
              exit 1
            fi
          done

      - name: Deployment skipped
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cloudflare.outputs.ready != 'true'
        run: echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable automatic production deployment."

      - name: Pull request verification complete
        if: github.event_name == 'pull_request'
        run: echo "Verification passed. Pull requests never deploy to production."
