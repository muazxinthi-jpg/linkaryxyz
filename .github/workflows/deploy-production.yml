name: Linkary production

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: linkary-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enforce approved product change approval
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PRODUCT_CHANGE_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'approved-product-change') }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF" --depth=50

          # Bootstrap: the first PR that introduces the preservation contract is
          # allowed to establish the guard. Once the base branch contains it,
          # changing or deleting the contract/test requires explicit approval.
          if ! git cat-file -e "origin/${BASE_REF}:docs/APPROVED_PRODUCT_PRESERVATION.md" 2>/dev/null; then
            echo "Establishing approved product preservation contract."
            exit 0
          fi

          changed=$(git diff --name-only "origin/${BASE_REF}" HEAD)
          if printf '%s\n' "$changed" | grep -Eq '^(docs/APPROVED_PRODUCT_PRESERVATION\.md|tests/approved-product-preservation\.test\.ts)$'; then
            if [[ "$PRODUCT_CHANGE_APPROVED" != "true" ]]; then
              echo "::error::Approved product preservation contract changed. Explicit product-owner approval is required before this PR can merge. Add the approved-product-change label only after that approval."
              exit 1
            fi
            echo "Approved product preservation change acknowledged by PR label."
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run regression tests
        run: npm test

      - name: Type-check Worker backend
        run: npm run backend:check

      - name: Type-check authenticated app
        run: npm run app:check

      - name: Wrangler dry run
        run: npm run deploy:dry

      - name: Public overlay Wrangler dry run
        run: npm run deploy:public:dry

      - name: Check Cloudflare deployment credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: cloudflare
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare repository secrets are not configured. Verification passed, deployment will be skipped."
          fi

      - name: Report production D1 migration state
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::warning::D1 verification credentials are not configured; skipping read-only migration state check."
            exit 0
          fi
          echo "Read-only production D1 migration state:"
          npx wrangler d1 migrations list linkary-db --remote

      - name: Deploy Worker to production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cloudflare.outputs.ready == 'true'
        run: npm run deploy

      - name: Deploy public overlay to production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cloudflare.outputs.ready == 'true'
        run: npm run deploy:public

      - name: Verify production public site positioning
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cloudflare.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ok=false
          for attempt in {1..12}; do
            body="/tmp/linkary-public-${attempt}.html"
            status=$(curl -sS -o "$body" -w '%{http_code}' "https://linkary.xyz/?deploycheck=${GITHUB_SHA}-${attempt}") || status=000
            if [[ "$status" == "200" ]] \
              && grep -Fq 'Run growth anywhere.' "$body" \
              && grep -Fq 'Track it in Linkary.' "$body" \
              && grep -Fq 'External campaigns' "$body"; then
              echo "Healthy: https://linkary.xyz is serving tracking-first positioning"
              ok=true
              break
            fi
            echo "Waiting for current public positioning, attempt ${attempt}, status ${status}"
            sleep 5
          done
          if [[ "$ok" != "true" ]]; then
            echo "::error::Public site is not serving the current tracking-first Linkary positioning"
            exit 1
          fi

      - name: Verify production app health
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cloudflare.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for path in / /profile; do
            ok=false
            for attempt in {1..12}; do
              body="/tmp/linkary-health-${attempt}.html"
              status=$(curl -sS -o "$body" -w '%{http_code}' "https://app.linkary.xyz${path}?deploycheck=${GITHUB_SHA}-${attempt}") || status=000
              if [[ "$status" == "200" ]] && grep -q 'id="root"' "$body"; then
                echo "Healthy: https://app.linkary.xyz${path}"
                ok=true
                break
              fi
              echo "Waiting for app route ${path}, attempt ${attempt}, status ${status}"
              sleep 5
            done
            if [[ "$ok" != "true" ]]; then
              echo "Production app health check failed for https://app.linkary.xyz${path}"
              exit 1
            fi
          done

      - name: Verify production invites shell health
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cloudflare.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ok=false
          for attempt in {1..12}; do
            body="/tmp/linkary-invites-health-${attempt}.html"
            status=$(curl -sS -o "$body" -w '%{http_code}' "https://app.linkary.xyz/invites?deploycheck=${GITHUB_SHA}-${attempt}") || status=000
            if [[ "$status" == "200" ]] && grep -q 'id="root"' "$body"; then
              echo "Healthy: https://app.linkary.xyz/invites"
              ok=true
              break
            fi
            echo "Waiting for app route /invites, attempt ${attempt}, status ${status}"
            sleep 5
          done
          if [[ "$ok" != "true" ]]; then
            echo "Production app health check failed for https://app.linkary.xyz/invites"
            exit 1
          fi

      - name: Verify Superadmin serves current production bundle (100-percent coupon + protected frontend)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cloudflare.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          healthy=false
          for attempt in {1..12}; do
            app_body="/tmp/linkary-app-bundle-${attempt}.html"
            sadmin_body="/tmp/linkary-sadmin-bundle-${attempt}.html"
            sadmin_headers="/tmp/linkary-sadmin-headers-${attempt}.txt"
            bundle_body="/tmp/linkary-sadmin-js-${attempt}.js"
            app_status=$(curl -sS -o "$app_body" -w '%{http_code}' "https://app.linkary.xyz/?bundlecheck=${GITHUB_SHA}-${attempt}") || app_status=000
            sadmin_status=$(curl -sS -D "$sadmin_headers" -o "$sadmin_body" -w '%{http_code}' "https://sadmin.linkary.xyz/?bundlecheck=${GITHUB_SHA}-${attempt}") || sadmin_status=000
            app_bundle=$(grep -oE '/assets/linkary-app/assets/index-[A-Za-z0-9_-]+\.js' "$app_body" | head -n 1 || true)
            sadmin_bundle=$(grep -oE '/assets/linkary-app/assets/index-[A-Za-z0-9_-]+\.js' "$sadmin_body" | head -n 1 || true)
            bundle_status=000
            if [[ -n "$sadmin_bundle" ]]; then
              bundle_status=$(curl -sS -o "$bundle_body" -w '%{http_code}' "https://sadmin.linkary.xyz${sadmin_bundle}?bundlecontent=${GITHUB_SHA}-${attempt}") || bundle_status=000
            fi
            if [[ "$app_status" == "200" && "$sadmin_status" == "200" && "$bundle_status" == "200" ]] \
              && grep -q 'id="root"' "$app_body" \
              && grep -q 'id="root"' "$sadmin_body" \
              && [[ -n "$app_bundle" && "$app_bundle" == "$sadmin_bundle" ]] \
              && grep -qi '^x-robots-tag: noindex' "$sadmin_headers" \
              && grep -qi '^cache-control: .*no-store' "$sadmin_headers" \
              && grep -Fq '100% coupon created.' "$bundle_body" \
              && grep -Fq 'claim timing kept separate from entitlement expiry.' "$bundle_body" \
              && grep -Fq 'Claim end controls when a code may be redeemed.' "$bundle_body" \
              && grep -Fq 'Access until controls the fixed entitlement expiry' "$bundle_body" \
              && ! grep -Fq 'Coupons cannot reduce a paid checkout to $0' "$bundle_body" \
              && grep -Fq 'Profile optimization' "$bundle_body" \
              && grep -Fq 'My network' "$bundle_body" \
              && grep -Fq 'Network map' "$bundle_body" \
              && grep -Fq 'Private Network views' "$bundle_body" \
              && grep -Fq '2026-09-08-v3' "$bundle_body"; then
              echo "Production is serving the current protected frontend bundle: ${sadmin_bundle}"
              healthy=true
              break
            fi
            echo "Waiting for current protected frontend bundle, attempt ${attempt}, app=${app_status}:${app_bundle:-none}, sadmin=${sadmin_status}:${sadmin_bundle:-none}, js=${bundle_status}"
            sleep 5
          done
          if [[ "$healthy" != "true" ]]; then
            echo "::error::Production is not serving the current protected frontend bundle with Profile Optimization and Private Network tabs"
            exit 1
          fi

      - name: Deployment skipped
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cloudflare.outputs.ready != 'true'
        run: echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable automatic production deployment."

      - name: Pull request verification complete
        if: github.event_name == 'pull_request'
        run: echo "Verification passed. Pull requests never deploy to production."
