name: Linkary production

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: linkary-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run regression tests
        run: npm test

      - name: Type-check authenticated app
        run: npm run app:check

      - name: Wrangler dry run
        run: npm run deploy:dry

      - name: Diagnose live NFT profile preview
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          profile="/tmp/linkary-muazxinthi.html"
          public_json="/tmp/linkary-muazxinthi.json"
          status=$(curl -sS -L -o "$profile" -w '%{http_code}' "https://linkary.xyz/muazxinthi?diag=${GITHUB_SHA}")
          api_status=$(curl -sS -o "$public_json" -w '%{http_code}' "https://linkary.xyz/api/public/profiles/muazxinthi?diag=${GITHUB_SHA}")
          echo "PROFILE_STATUS=$status"
          echo "PUBLIC_JSON_STATUS=$api_status"
          python - <<'PY'
          import html, json, re, subprocess
          from pathlib import Path
          source = Path('/tmp/linkary-muazxinthi.html').read_text(errors='replace')
          section = re.search(r'<section class="showcase nft-showcase">[\s\S]*?</section>', source)
          if not section:
              print('NFT_SECTION_NOT_FOUND')
          else:
              text = section.group(0)
              cards = re.findall(r'<a class="showcase-item"[^>]*>([\s\S]*?)</a>', text)
              print(f'NFT_CARD_COUNT={len(cards)}')
              for index, card in enumerate(cards, 1):
                  title_match = re.search(r'<strong>([\s\S]*?)</strong>', card)
                  title = html.unescape(re.sub(r'<[^>]+>', '', title_match.group(1))).strip() if title_match else '(untitled)'
                  img_match = re.search(r'<img src="([^"]+)"', card)
                  print(f'NFT_{index}_TITLE={title}')
                  if not img_match:
                      print(f'NFT_{index}_IMAGE=NONE')
                  else:
                      src = html.unescape(img_match.group(1))
                      print(f'NFT_{index}_IMAGE={src}')
                      proc = subprocess.run(['curl','-sS','-L','-I','-o','/dev/null','-w','%{http_code}|%{content_type}|%{url_effective}',src], capture_output=True, text=True)
                      print(f'NFT_{index}_HEAD={proc.stdout.strip() or "curl_failed"}')

          payload = json.loads(Path('/tmp/linkary-muazxinthi.json').read_text(errors='replace'))
          nft_blocks = [b for b in payload.get('blocks', []) if b.get('type') == 'nft_item']
          print(f'NFT_PUBLIC_BLOCK_COUNT={len(nft_blocks)}')
          for index, block in enumerate(nft_blocks, 1):
              config = block.get('config') or {}
              print(f'NFT_BLOCK_{index}_TITLE={block.get("title") or ""}')
              print(f'NFT_BLOCK_{index}_DESTINATION={block.get("url") or ""}')
              print(f'NFT_BLOCK_{index}_CHAIN={config.get("chain") or ""}')
              print(f'NFT_BLOCK_{index}_SAVED_MEDIA={config.get("mediaUrl") or ""}')
          PY

      - name: Check Cloudflare deployment credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: cloudflare
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare repository secrets are not configured. Verification passed, deployment will be skipped."
          fi

      - name: Deploy Worker to production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cloudflare.outputs.ready == 'true'
        run: npm run deploy

      - name: Verify production app health
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cloudflare.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for path in / /profile; do
            ok=false
            for attempt in {1..12}; do
              body="/tmp/linkary-health-${attempt}.html"
              status=$(curl -sS -o "$body" -w '%{http_code}' "https://app.linkary.xyz${path}?deploycheck=${GITHUB_SHA}-${attempt}") || status=000
              if [[ "$status" == "200" ]] && grep -q 'id="root"' "$body"; then
                echo "Healthy: https://app.linkary.xyz${path}"
                ok=true
                break
              fi
              echo "Waiting for app route ${path}, attempt ${attempt}, status ${status}"
              sleep 5
            done
            if [[ "$ok" != "true" ]]; then
              echo "Production app health check failed for https://app.linkary.xyz${path}"
              exit 1
            fi
          done

      - name: Deployment skipped
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cloudflare.outputs.ready != 'true'
        run: echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable automatic production deployment."

      - name: Pull request verification complete
        if: github.event_name == 'pull_request'
        run: echo "Verification passed. Pull requests never deploy to production."
