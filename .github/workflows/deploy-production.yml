name: Linkary production

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: linkary-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Synchronize npm lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: synchronize npm lockfile [skip ci]"
            git push origin HEAD:main
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run regression tests
        run: npm test

      - name: Type-check authenticated app
        run: npm run app:check

      - name: Wrangler dry run
        run: npm run deploy:dry

      - name: Check Cloudflare deployment credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: cloudflare
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare repository secrets are not configured. Verification passed, deployment will be skipped."
          fi

      - name: Deploy Worker to production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cloudflare.outputs.ready == 'true'
        run: npm run deploy

      - name: Deployment skipped
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cloudflare.outputs.ready != 'true'
        run: echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable automatic production deployment."

      - name: Pull request verification complete
        if: github.event_name == 'pull_request'
        run: echo "Verification passed. Pull requests never deploy to production."
