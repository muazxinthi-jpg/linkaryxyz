name: NFT live diagnostic

on:
  push:
    branches:
      - diagnostic/nft-live

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: List Worker secret names
        run: npx wrangler secret list
      - name: Read live NFT block configuration
        shell: bash
        run: |
          npx wrangler d1 execute linkary-db --remote --command "SELECT pb.id, pb.title, pb.url, pb.config_json FROM profile_blocks pb JOIN profiles p ON p.id = pb.profile_id WHERE lower(p.username) = 'muazxinthi' AND pb.block_type = 'nft_item';"
