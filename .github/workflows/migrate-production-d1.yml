name: Linkary production D1 migrations

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linkary-production-d1-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run regression tests
        run: npm test
      - name: Apply versioned migrations to production
        run: npx wrangler d1 migrations apply linkary-db --remote
      - name: Verify migration state
        run: npx wrangler d1 migrations list linkary-db --remote
