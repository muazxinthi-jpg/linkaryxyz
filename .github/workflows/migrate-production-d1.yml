name: Linkary production D1 migrations

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify production D1, or verify then apply pending versioned migrations
        required: true
        default: verify
        type: choice
        options:
          - verify
          - apply

permissions:
  contents: read

concurrency:
  group: linkary-production-d1-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out production source of truth
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Confirm main checkout
        run: |
          test "$(git branch --show-current)" = "main"
          echo "Production migration source: $(git rev-parse HEAD)"
          echo "Latest repository migration: $(ls migrations/*.sql | sort | tail -1)"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run regression tests
        run: npm test
      - name: Preflight production migration state
        id: preflight
        shell: bash
        run: |
          set -o pipefail
          output="$(npx wrangler d1 migrations list linkary-db --remote 2>&1)"
          printf '%s\n' "$output"
          if [[ "${{ inputs.mode }}" == "verify" && "$output" != *"No migrations to apply!"* ]]; then
            echo "::error::Production D1 has pending migrations. Review the list above, then re-run this workflow with mode=apply."
            exit 1
          fi
      - name: Apply versioned migrations to production
        if: ${{ inputs.mode == 'apply' }}
        run: npx wrangler d1 migrations apply linkary-db --remote
      - name: Verify migration state after apply
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -o pipefail
          output="$(npx wrangler d1 migrations list linkary-db --remote 2>&1)"
          printf '%s\n' "$output"
          if [[ "$output" != *"No migrations to apply!"* ]]; then
            echo "::error::Production D1 still has pending migrations after apply."
            exit 1
          fi
