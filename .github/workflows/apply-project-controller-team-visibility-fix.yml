name: Apply Project controller team visibility fix

on:
  push:
    branches:
      - fix/project-registration-controller-team-visibility
    paths:
      - .github/workflows/apply-project-controller-team-visibility-fix.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/project-registration-controller-team-visibility
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply guarded Project team visibility repair
        run: python scripts/apply-project-controller-team-visibility-fix.py
      - name: Install dependencies
        run: npm ci
      - name: Run focused Project access tests
        run: npx tsx --test tests/project-registration-controller-team-visibility.test.ts tests/project-access-transition-race.test.ts tests/project-team-invites.test.ts tests/beta-responsive-project-control-pass6.test.ts
      - name: Run full repository checks
        run: npm run check
      - name: Commit verified repair
        run: |
          git config user.name "Muaz Linkary"
          git config user.email "muazxinthi@gmail.com"
          git add src/routes/projectAccess.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: separate project controller from explicit team"
          git push origin HEAD:fix/project-registration-controller-team-visibility
