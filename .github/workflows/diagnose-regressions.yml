name: Linkary regression diagnostics

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Regression A-E
        id: regress_a_e
        continue-on-error: true
        run: npx tsx --test tests/[a-eA-E]*.test.ts

      - name: Regression F-J
        id: regress_f_j
        continue-on-error: true
        run: npx tsx --test tests/[f-jF-J]*.test.ts

      - name: Regression K-O
        id: regress_k_o
        continue-on-error: true
        run: npx tsx --test tests/[k-oK-O]*.test.ts

      - name: Regression P-T
        id: regress_p_t
        continue-on-error: true
        run: npx tsx --test tests/[p-tP-T]*.test.ts

      - name: Regression U-Z
        id: regress_u_z
        continue-on-error: true
        run: npx tsx --test tests/[u-zU-Z]*.test.ts

      - name: FAIL A-E
        if: always() && steps.regress_a_e.outcome != 'success'
        run: exit 1

      - name: FAIL F-J
        if: always() && steps.regress_f_j.outcome != 'success'
        run: exit 1

      - name: FAIL K-O
        if: always() && steps.regress_k_o.outcome != 'success'
        run: exit 1

      - name: FAIL P-T
        if: always() && steps.regress_p_t.outcome != 'success'
        run: exit 1

      - name: FAIL U-Z
        if: always() && steps.regress_u_z.outcome != 'success'
        run: exit 1
