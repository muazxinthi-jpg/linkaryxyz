name: Linkary regression diagnostics

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: seven-generation-personal-network
        id: s_seven
        continue-on-error: true
        run: npx tsx --test tests/seven-generation-personal-network.test.ts

      - name: short-link-domain
        id: s_short
        continue-on-error: true
        run: npx tsx --test tests/short-link-domain.test.ts

      - name: social-brand-icons
        id: s_social
        continue-on-error: true
        run: npx tsx --test tests/social-brand-icons.test.ts

      - name: status-docs-current
        id: s_status
        continue-on-error: true
        run: npx tsx --test tests/status-docs-current.test.ts

      - name: superadmin-cache-freshness
        id: s_cache
        continue-on-error: true
        run: npx tsx --test tests/superadmin-cache-freshness.test.ts

      - name: superadmin-deployment-binding
        id: s_bind
        continue-on-error: true
        run: npx tsx --test tests/superadmin-deployment-binding.test.ts

      - name: superadmin-host
        id: s_host
        continue-on-error: true
        run: npx tsx --test tests/superadmin-host.test.ts

      - name: superadmin-platform-access
        id: s_access
        continue-on-error: true
        run: npx tsx --test tests/superadmin-platform-access.test.ts

      - name: FAIL seven-generation-personal-network
        if: always() && steps.s_seven.outcome != 'success'
        run: exit 1

      - name: FAIL short-link-domain
        if: always() && steps.s_short.outcome != 'success'
        run: exit 1

      - name: FAIL social-brand-icons
        if: always() && steps.s_social.outcome != 'success'
        run: exit 1

      - name: FAIL status-docs-current
        if: always() && steps.s_status.outcome != 'success'
        run: exit 1

      - name: FAIL superadmin-cache-freshness
        if: always() && steps.s_cache.outcome != 'success'
        run: exit 1

      - name: FAIL superadmin-deployment-binding
        if: always() && steps.s_bind.outcome != 'success'
        run: exit 1

      - name: FAIL superadmin-host
        if: always() && steps.s_host.outcome != 'success'
        run: exit 1

      - name: FAIL superadmin-platform-access
        if: always() && steps.s_access.outcome != 'success'
        run: exit 1
