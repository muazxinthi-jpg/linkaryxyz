name: Linkary regression diagnostics

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Regression A
        id: regress_a
        continue-on-error: true
        run: npx tsx --test tests/[aA]*.test.ts
      - name: Regression B
        id: regress_b
        continue-on-error: true
        run: npx tsx --test tests/[bB]*.test.ts
      - name: Regression C
        id: regress_c
        continue-on-error: true
        run: npx tsx --test tests/[cC]*.test.ts
      - name: Regression D
        id: regress_d
        continue-on-error: true
        run: npx tsx --test tests/[dD]*.test.ts
      - name: Regression E
        id: regress_e
        continue-on-error: true
        run: npx tsx --test tests/[eE]*.test.ts
      - name: Regression P
        id: regress_p
        continue-on-error: true
        run: npx tsx --test tests/[pP]*.test.ts
      - name: Regression Q
        id: regress_q
        continue-on-error: true
        run: npx tsx --test tests/[qQ]*.test.ts
      - name: Regression R
        id: regress_r
        continue-on-error: true
        run: npx tsx --test tests/[rR]*.test.ts
      - name: Regression S
        id: regress_s
        continue-on-error: true
        run: npx tsx --test tests/[sS]*.test.ts
      - name: Regression T
        id: regress_t
        continue-on-error: true
        run: npx tsx --test tests/[tT]*.test.ts

      - name: FAIL A
        if: always() && steps.regress_a.outcome != 'success'
        run: exit 1
      - name: FAIL B
        if: always() && steps.regress_b.outcome != 'success'
        run: exit 1
      - name: FAIL C
        if: always() && steps.regress_c.outcome != 'success'
        run: exit 1
      - name: FAIL D
        if: always() && steps.regress_d.outcome != 'success'
        run: exit 1
      - name: FAIL E
        if: always() && steps.regress_e.outcome != 'success'
        run: exit 1
      - name: FAIL P
        if: always() && steps.regress_p.outcome != 'success'
        run: exit 1
      - name: FAIL Q
        if: always() && steps.regress_q.outcome != 'success'
        run: exit 1
      - name: FAIL R
        if: always() && steps.regress_r.outcome != 'success'
        run: exit 1
      - name: FAIL S
        if: always() && steps.regress_s.outcome != 'success'
        run: exit 1
      - name: FAIL T
        if: always() && steps.regress_t.outcome != 'success'
        run: exit 1
