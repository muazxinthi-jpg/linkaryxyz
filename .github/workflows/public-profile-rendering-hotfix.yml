name: Apply public profile rendering hotfix

on:
  push:
    branches:
      - hotfix/public-profile-rendering-regression
    paths:
      - .github/workflows/public-profile-rendering-hotfix.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/public-profile-rendering-regression
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Apply guarded renderer repair
        run: python scripts/public-profile-rendering-hotfix.py
      - name: Install dependencies
        run: npm ci
      - name: Run focused public profile regression tests
        run: npx tsx --test tests/public-profile-rendering-hotfix.test.ts tests/public-profile-analytics-layout-regression.test.ts
      - name: Run full repository checks
        run: npm run check
      - name: Commit verified hotfix
        shell: bash
        run: |
          git config user.name 'Linkary Engineering'
          git config user.email 'engineering@linkary.xyz'
          git add src/routes/profiles.ts tests/public-profile-rendering-hotfix.test.ts tests/public-profile-analytics-layout-regression.test.ts
          git diff --cached --check
          git commit -m 'Fix public profile rendering regression'
          git push origin HEAD:hotfix/public-profile-rendering-regression

# Verification pass 2: aligned guards with the repaired renderer structure.
