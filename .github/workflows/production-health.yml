name: Linkary production health

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows:
      - Linkary production
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: linkary-production-health
  cancel-in-progress: true

jobs:
  health:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check authenticated app shell routes
        shell: bash
        run: |
          set -euo pipefail
          routes=(
            "/"
            "/dashboard"
            "/dashboard/inbox"
            "/opportunities"
            "/communities"
            "/campaigns"
            "/tracking"
            "/partners"
            "/creators"
            "/profile"
            "/invites"
            "/wallets"
            "/settings/plan"
            "/settings/team-invites"
            "/settings"
            "/admin/readiness"
            "/admin/community-verifications"
            "/team-invite"
          )

          for path in "${routes[@]}"; do
            healthy=false
            for attempt in 1 2 3; do
              body="/tmp/linkary-route-${attempt}.html"
              status="$(curl --max-time 20 -sS -o "$body" -w '%{http_code}' "https://app.linkary.xyz${path}?healthcheck=${GITHUB_RUN_ID}-${attempt}")" || status=000
              if [[ "$status" == "200" ]] && grep -q 'id="root"' "$body"; then
                echo "Healthy app shell: ${path}"
                healthy=true
                break
              fi
              echo "Route check failed: ${path}, attempt ${attempt}, HTTP ${status}"
              sleep 5
            done
            if [[ "$healthy" != "true" ]]; then
              echo "::error::Linkary production app shell is unhealthy at ${path}"
              exit 1
            fi
          done

      - name: Check Private Network production UI contract
        shell: bash
        run: |
          set -euo pipefail
          healthy=false
          for attempt in 1 2 3; do
            app_body="/tmp/linkary-private-network-app-${attempt}.html"
            bundle_body="/tmp/linkary-private-network-bundle-${attempt}.js"
            app_status="$(curl --max-time 20 -sS -o "$app_body" -w '%{http_code}' "https://app.linkary.xyz/invites?networkcontract=${GITHUB_RUN_ID}-${attempt}")" || app_status=000
            app_bundle=$(grep -oE '/assets/linkary-app/assets/index-[A-Za-z0-9_-]+\.js' "$app_body" | head -n 1 || true)
            bundle_status=000
            if [[ -n "$app_bundle" ]]; then
              bundle_status="$(curl --max-time 20 -sS -o "$bundle_body" -w '%{http_code}' "https://app.linkary.xyz${app_bundle}?networkcontract=${GITHUB_RUN_ID}-${attempt}")" || bundle_status=000
            fi
            if [[ "$app_status" == "200" && "$bundle_status" == "200" ]] \
              && grep -Fq 'Invitations' "$bundle_body" \
              && grep -Fq 'My network' "$bundle_body" \
              && grep -Fq 'Network map' "$bundle_body" \
              && grep -Fq 'How your network connects' "$bundle_body" \
              && grep -Fq 'up to seven generations' "$bundle_body"; then
              echo "Healthy Private Network UI contract in production bundle: ${app_bundle}"
              healthy=true
              break
            fi
            echo "Private Network contract check failed: attempt ${attempt}, app=${app_status}, js=${bundle_status}, bundle=${app_bundle:-none}"
            sleep 5
          done
          if [[ "$healthy" != "true" ]]; then
            echo "::error::Private Network production bundle is missing an accepted Invitations / My network / Network map contract"
            exit 1
          fi

      - name: Check Superadmin bundle parity and noindex
        shell: bash
        run: |
          set -euo pipefail
          healthy=false
          for attempt in 1 2 3; do
            app_body="/tmp/linkary-health-app-${attempt}.html"
            sadmin_body="/tmp/linkary-health-sadmin-${attempt}.html"
            sadmin_headers="/tmp/linkary-health-sadmin-${attempt}.headers"
            app_status="$(curl --max-time 20 -sS -o "$app_body" -w '%{http_code}' "https://app.linkary.xyz/?sadminhealth=${GITHUB_RUN_ID}-${attempt}")" || app_status=000
            sadmin_status="$(curl --max-time 20 -sS -D "$sadmin_headers" -o "$sadmin_body" -w '%{http_code}' "https://sadmin.linkary.xyz/?sadminhealth=${GITHUB_RUN_ID}-${attempt}")" || sadmin_status=000
            app_bundle=$(grep -oE '/assets/linkary-app/assets/index-[A-Za-z0-9_-]+\.js' "$app_body" | head -n 1 || true)
            sadmin_bundle=$(grep -oE '/assets/linkary-app/assets/index-[A-Za-z0-9_-]+\.js' "$sadmin_body" | head -n 1 || true)
            if [[ "$app_status" == "200" && "$sadmin_status" == "200" ]] \
              && grep -q 'id="root"' "$sadmin_body" \
              && [[ -n "$app_bundle" && "$app_bundle" == "$sadmin_bundle" ]] \
              && grep -qi '^x-robots-tag: noindex' "$sadmin_headers"; then
              echo "Healthy Superadmin bundle: ${sadmin_bundle}"
              healthy=true
              break
            fi
            echo "Superadmin bundle check failed: attempt ${attempt}, app=${app_status}:${app_bundle:-none}, sadmin=${sadmin_status}:${sadmin_bundle:-none}"
            sleep 5
          done
          if [[ "$healthy" != "true" ]]; then
            echo "::error::Linkary Superadmin host is stale, unavailable, or missing noindex protection"
            exit 1
          fi

      - name: Check Worker API response
        shell: bash
        run: |
          set -euo pipefail
          healthy=false
          for attempt in 1 2 3; do
            body="/tmp/linkary-api-${attempt}.json"
            status="$(curl --max-time 20 -sS -o "$body" -w '%{http_code}' 'https://app.linkary.xyz/api/auth/me')" || status=000
            if [[ "$status" == "200" ]] && grep -q '"authenticated"' "$body"; then
              echo "Healthy API: /api/auth/me"
              healthy=true
              break
            fi
            echo "API check failed: attempt ${attempt}, HTTP ${status}"
            sleep 5
          done
          if [[ "$healthy" != "true" ]]; then
            echo "::error::Linkary production API health check failed"
            exit 1
          fi

      - name: Check launch security headers
        shell: bash
        run: |
          set -euo pipefail
          for target in 'https://app.linkary.xyz/' 'https://app.linkary.xyz/api/auth/me'; do
            headers="/tmp/linkary-security-headers.txt"
            curl --max-time 20 -sS -D "$headers" -o /dev/null "$target"
            grep -qi '^x-content-type-options: nosniff' "$headers"
            grep -qi '^referrer-policy: strict-origin-when-cross-origin' "$headers"
            grep -qi '^permissions-policy: camera=(), microphone=(), geolocation=()' "$headers"
            grep -qi '^strict-transport-security: max-age=31536000; includeSubDomains' "$headers"
            echo "Launch security headers healthy: ${target}"
          done
