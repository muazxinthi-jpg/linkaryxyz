name: Apply profile preview and section fix

on:
  push:
    branches:
      - fix/profile-preview-section-parity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/profile-preview-section-parity
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-profile-preview-section-fix.mjs
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run app:check
      - run: npm run deploy:dry
      - name: Commit patched files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/ProfileExperienceBeta.tsx frontend/src/profile-beta.css src/routes/profiles.ts tests/profile-editor-social-nft.test.ts tests/public-profile-readability.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: align profile editor preview and custom section headings"
          git push origin HEAD:fix/profile-preview-section-parity
