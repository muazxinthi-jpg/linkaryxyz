name: Apply app static prefix hotfix

on:
  push:
    branches:
      - hotfix/app-static-asset-prefix

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/app-static-asset-prefix
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply narrow static asset hotfix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  if new in text:
                      return
                  raise SystemExit(f'Expected text not found in {path}: {old!r}')
              p.write_text(text.replace(old, new))

          replace('frontend/vite.config.ts', "  base: '/app/',", "  base: '/assets/linkary-app/',")
          replace('frontend/vite.config.ts', "    outDir: '../app',", "    outDir: '../assets/linkary-app',")

          for path in ['src/index.ts', 'src/static.ts', 'tests/app-deep-link-fallback.test.ts', 'tests/core.test.ts']:
              p = Path(path)
              text = p.read_text()
              text = text.replace('/app/index.html', '/assets/linkary-app/index.html')
              p.write_text(text)

          replace(
              'tests/app-deep-link-fallback.test.ts',
              "https://app.linkary.xyz/app/assets/missing.js",
              "https://app.linkary.xyz/assets/linkary-app/assets/missing.js",
          )
          replace(
              'tests/app-deep-link-fallback.test.ts',
              "assert.deepEqual(requestedPaths, ['/app/assets/missing.js']);",
              "assert.deepEqual(requestedPaths, ['/assets/linkary-app/assets/missing.js']);",
          )

          gitignore = Path('.gitignore')
          text = gitignore.read_text()
          if 'assets/linkary-app/' not in text:
              text = text.replace('app/\n', 'app/\nassets/linkary-app/\n')
              gitignore.write_text(text)

          core = Path('tests/core.test.ts')
          text = core.read_text()
          needle = "  assert.equal(wrangler.assets.html_handling, 'none');\n"
          addition = "  assert.equal(wrangler.assets.html_handling, 'none');\n  const vite = readFileSync(new URL('../frontend/vite.config.ts', import.meta.url), 'utf8');\n  assert.equal(vite.includes(\"base: '/assets/linkary-app/'\"), true);\n  assert.equal(vite.includes(\"outDir: '../assets/linkary-app'\"), true);\n"
          if addition not in text:
              if needle not in text:
                  raise SystemExit('core test insertion point not found')
              text = text.replace(needle, addition)
              core.write_text(text)

          deploy = Path('.github/workflows/deploy-production.yml')
          text = deploy.read_text()
          anchor = "      - name: Deployment skipped\n        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cloudflare.outputs.ready != 'true'\n        run: echo \"Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable automatic production deployment.\"\n"
          health = """      - name: Verify production app health
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cloudflare.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for path in / /profile; do
            ok=false
            for attempt in {1..12}; do
              body="/tmp/linkary-health-${attempt}.html"
              status=$(curl -sS -o "$body" -w '%{http_code}' "https://app.linkary.xyz${path}?deploycheck=${GITHUB_SHA}-${attempt}") || status=000
              if [[ "$status" == "200" ]] && grep -q 'id="root"' "$body"; then
                echo "Healthy: https://app.linkary.xyz${path}"
                ok=true
                break
              fi
              echo "Waiting for app route ${path}, attempt ${attempt}, status ${status}"
              sleep 5
            done
            if [[ "$ok" != "true" ]]; then
              echo "Production app health check failed for https://app.linkary.xyz${path}"
              exit 1
            fi
          done

"""
          if 'Verify production app health' not in text:
              if anchor not in text:
                  raise SystemExit('deploy workflow insertion point not found')
              text = text.replace(anchor, health + anchor)
              deploy.write_text(text)

          core = Path('tests/core.test.ts')
          text = core.read_text()
          marker = "test('app host serves the React shell at the clean root URL', async () => {"
          test_block = """test('production deployment verifies the real app host after Worker deployment', () => {
  const workflow = readFileSync(new URL('../.github/workflows/deploy-production.yml', import.meta.url), 'utf8');
  assert.equal(workflow.includes('Verify production app health'), true);
  assert.equal(workflow.includes('https://app.linkary.xyz${path}?deploycheck='), true);
  assert.equal(workflow.includes("grep -q 'id=\\\"root\\\"'"), true);
});

"""
          if test_block not in text:
              if marker not in text:
                  raise SystemExit('health test insertion point not found')
              text = text.replace(marker, test_block + marker)
              core.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run regression tests
        run: npm test
      - name: Type-check authenticated app
        run: npm run app:check
      - name: Wrangler dry run
        run: npm run deploy:dry
      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/vite.config.ts src/index.ts src/static.ts tests/app-deep-link-fallback.test.ts tests/core.test.ts .gitignore .github/workflows/deploy-production.yml
          if git diff --cached --quiet; then
            echo 'No product changes to commit.'
            exit 0
          fi
          git commit -m 'fix: serve authenticated app from stable asset namespace'
          git push origin HEAD:hotfix/app-static-asset-prefix
